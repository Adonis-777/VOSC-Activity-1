<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tic-Tac-Toe</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="game">
    <h1>Tic-Tac-Toe</h1>

    <div class="mode-select">
      <button id="modePvP" class="mode-btn active">2 Players</button>
      <button id="modeCPU" class="mode-btn">Vs Computer</button>
    </div>

    <p class="status" id="status">Player X's turn</p>

    <div class="board" id="board">
      <button class="cell" data-index="0"></button>
      <button class="cell" data-index="1"></button>
      <button class="cell" data-index="2"></button>
      <button class="cell" data-index="3"></button>
      <button class="cell" data-index="4"></button>
      <button class="cell" data-index="5"></button>
      <button class="cell" data-index="6"></button>
      <button class="cell" data-index="7"></button>
      <button class="cell" data-index="8"></button>
    </div>

    <div class="scoreboard">
      <div class="score"><span>Player X</span><strong id="scoreX">0</strong></div>
      <div class="score"><span>Draws</span><strong id="scoreD">0</strong></div>
      <div class="score"><span id="scoreOLabel">Player O</span><strong id="scoreO">0</strong></div>
    </div>

    <button id="resetBtn" class="reset-btn">Restart Round</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
